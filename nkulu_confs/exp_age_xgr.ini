[EXP]
root = ./experiments/age24/results
name = segmented
epochs = 1000
type = regression
[DATA]
databases = ['data']
data = databases/age24/segmented.csv
#data = data/age24/maspra_2024.csv
data.type = csv
data.absolute_path = False
data.split_strategy = speaker_split
target = age
labels = ['young', 'old']
bins  = [-100000, 40, 100000]
[FEATS]
type = ["os"]
#type = ["agender"]
scale = standard
[MODEL]
type = xgr
#C_val = 10
tuning_params = ['C']
scoring = neg_mean_squared_error
C = [10, 1, 0.1, 0.01, 0.001, 0.0001]
#type = mlp_reg
#layers = {'l1':256, 'l2':16}
measure = ccc
loss = 1-ccc
#patience = 10
[SEGMENT]
method = silero
segment_target = _segmented
sample_selection = all
[EXPL]
sample_selection = all 
value_counts = [['sex'], ['duration']] 
[PLOT]
epoch_progression = True
best_model = True
