[EXP]
root = "databases/Hsin-Hua/"
name = Hsin_Hua
runs = 1
epochs = 1
save = True
[DATA]
databases = ['data']
data = ./data/Hsin-Hua/Hsin-Hua.csv
data.type = csv
data.absolute_path = False
data.split_strategy = random
target = age
labels = ['young', 'old']
bins  = [-100000, 40, 100000]
[SEGMENT]
target = _segmented
method = silero
sample_selection = all
#min_length = 2
max_length = 10
[FEATS]
type = ['os']
scale = standard
[MODEL]
type = svm
